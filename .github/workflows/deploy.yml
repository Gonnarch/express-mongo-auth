name: CI y despliegue en Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-main
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar sintaxis
        run: find src -type f -name '*.js' -exec node --check {} \;

      - name: Solicitar despliegue en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Falta configurar RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --request POST "$DEPLOY_HOOK"